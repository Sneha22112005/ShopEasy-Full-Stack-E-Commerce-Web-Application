<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ShopEasy - Shopping Cart
    </title>

    <link
        rel="stylesheet"
        href="./CSS/js/style.css">

</head>


<body>


    <header>

        <h1 class="logo">
            🛒 ShopEasy
        </h1>


        <nav>

            <a href="./index.html">
                Home
            </a>


            <a href="./CSS/js/products.html">
                Products
            </a>


            <a href="./cart.html">

                Cart 🛒

                <span id="cartCount">
                    0
                </span>

            </a>


            <a href="./CSS/js/orders.html">
                My Orders
            </a>

        </nav>

    </header>


    <main>

        <section class="section cart-section">

            <h2>
                Shopping Cart
            </h2>


            <div
                id="cartContainer"
                class="cart-container">

            </div>


            <div
                id="cartSummary"
                class="cart-summary">


                <h3>

                    Total Items:

                    <span id="cartItemCount">
                        0
                    </span>

                </h3>


                <h3>

                    Total:

                    ₹<span id="cartTotal">
                        0
                    </span>

                </h3>


                <div class="cart-buttons">


                    <button
                        type="button"
                        class="clear-cart-btn"
                        onclick="clearCart()">

                        🗑️ Clear Cart

                    </button>


                    <button
                        type="button"
                        class="checkout-btn"
                        onclick="goToCheckout()">

                        Proceed to Checkout →

                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <script src="./CSS/js/main.js"></script>

    <script src="./CSS/js/cart.js"></script>


</body>

</html>
